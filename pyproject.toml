[project]
name = "vhelper"
version = "0.0.3"
description = "Verilog helpful function"
requires-python = ">=3.12"
dependencies = [
    "nlpertools>=1.0.19",
    "sympy>=1.12",
]

[build-system]
requires = ["uv_build>=0.8.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["vhelper"]
